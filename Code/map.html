<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Cannons Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="db.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>

<div id="map"></div>

<div id="SearchPanel">
  <input 
    type="text" 
    id="searchInput" 
    placeholder="Search sites...">

  <select id="filterHoles">
    <option value="">Filter by hole count</option>
    <option value="0">0 holes</option>
    <option value="5">1-5 holes</option>
    <option value="10">6-10 holes</option>
    <option value="999">11+ holes</option>
  </select>
  <div id="userBtn" class="user-circle"></div>
  <!--<button class="btn-add" onclick="window.location.href='add.html'">Add Site</button>  
  <button id="adminPanel" onclick="window.location.href='admin.html'">Review</button>-->
  <button id="langToggle">CY</button>
  
</div>

<div id="english-welsh-toggle">
  <button id="englishBtn" class="active">English</button>
  <button id="welshBtn">Welsh</button>
</div>


<div id="sitePopup" class="popup hidden">
  <h3 id="popupTitle"></h3>
  <p id="popupDesc"></p>
  <p id="popupHole"></p>
  <div class="popup-image-wrapper">
    <button id="prevPhotoBtn" class="popup-image-nav">&lt;</button>
    <img id="popuppicture" src="" alt="no picture available">
    <button id="nextPhotoBtn" class="popup-image-nav">&gt;</button>
  </div>

  <div class="popup-actions">
    <button id="openFullBtn">Open full page</button>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>

  console.log("PAGE LOADED");
</script>
</body>
</html>
