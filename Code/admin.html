<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>

  <style>
    :root {
      --bg: #272c2e;
      --bg-deeper: #1c2022;

      --glass: rgba(255,255,255,0.06);
      --glass-strong: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.08);

      --text: #ffffff;
      --muted: rgba(255,255,255,0.7);

      --accent: #26bd66;
      --accent-dark: #117d3e;

      --danger: #e74c3c;
      --warn: #f39c12;
      --success: #2ecc71;

      --blue-soft: rgba(59,130,246,0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      background: var(--glass);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-top input,
    .sidebar-top select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    .site-list {
      flex: 1;
      overflow-y: auto;
    }

    .site-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: 0.2s;
    }

    .site-item:hover {
      background: var(--glass-strong);
    }

    .site-item.active {
      background: rgba(38,189,102,0.12);
      border-left: 3px solid var(--accent);
    }

    .site-name {
      font-weight: 600;
      margin-bottom: 6px;
    }

    /* BADGES */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: white;
    }

    .approved { background: var(--success); }
    .pending { background: var(--warn); }
    .rejected { background: var(--danger); }

    /* EDITOR */
    .editor {
      overflow-y: auto;
      padding: 24px;
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      backdrop-filter: blur(18px);
      max-width: 1000px;
      margin: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* PHOTOS */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .photo-card {
      position: relative;
    }

    .photo-card img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
    }

    .delete-photo {
      position: absolute;
      top: 8px;
      right: 8px;
      border: none;
      background: rgba(0,0,0,0.75);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* BUTTONS */
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .save-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      box-shadow: 0 10px 25px rgba(38,189,102,0.25);
    }

    .approve-btn {
      background: var(--success);
      color: white;
    }

    .reject-btn {
      background: var(--warn);
      color: white;
    }

    .delete-btn {
      background: var(--danger);
      color: white;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 100px;
    }

    /* BACK BUTTON */
    .back-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;

      border: none;
      border-radius: 12px;
      padding: 12px 18px;

      background: rgba(255,255,255,0.08);
      color: white;

      font-weight: 600;
      cursor: pointer;

      backdrop-filter: blur(10px);
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: 320px;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .editor {
        padding: 16px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<button class="back-btn" onclick="window.location.href='map.html'">
  ← Back to Map
</button>

<div class="layout">

  <div class="sidebar">

    <div class="sidebar-top">
      <input id="searchInput" placeholder="Search sites...">

      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="approved">Approved</option>
        <option value="pending">Pending</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>

    <div id="siteList" class="site-list"></div>
  </div>

  <div class="editor">
    <div class="card" id="editorCard">
      <div class="empty">
        Select a site to edit
      </div>
    </div>
  </div>

</div>

<script>
let sites = [];
let currentSite = null;
let currentPhotos = [];

async function checkAccess() {

  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const user = session.user;

  const { data } = await sb
    .from('users')
    .select('role')
    .eq('user_id', user.id)
    .single();

  if (!data || data.role !== 'admin') {
    document.body.innerHTML = '<h1 style="padding:40px;color:white;">Access denied</h1>';
    return;
  }

  loadSites();
}

async function loadSites() {
  const { data, error } = await sb
    .from('sites')
    .select('*')
    .order('site_id', { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  sites = data || [];
  renderSiteList();
}

function renderSiteList() {
  const container = document.getElementById('siteList');

  const search =
    document.getElementById('searchInput')?.value?.toLowerCase() || "";

  const filter =
    document.getElementById('statusFilter')?.value || "";

  container.innerHTML = '';

  const filtered = sites.filter(site => {

    if (
      search &&
      !site.name.toLowerCase().includes(search)
    ) return false;

    if (filter && site.status !== filter) return false;

    return true;
  });

  filtered.forEach(site => {
    const item = document.createElement('div');
    item.className = 'site-item';

    if (currentSite?.site_id === site.site_id) {
      item.classList.add('active');
    }

    item.innerHTML = `
      <div class="site-name">${site.name}</div>
      <span class="badge ${site.status}">
        ${site.status}
      </span>
    `;

    item.onclick = () => openSite(site);

    container.appendChild(item);
  });
}

async function openSite(site) {
  currentSite = site;
  renderSiteList();

  let desc = {};
  try {
    desc = JSON.parse(site.description || '{}');
  } catch {}

  const { data: photos } = await sb
    .from('photos')
    .select('*')
    .eq('site_id', site.site_id);

  currentPhotos = photos || [];

  const card = document.getElementById('editorCard');

  card.innerHTML = `
    <h1>Edit Site</h1>

    <div class="field">
      <label>Name</label>
      <input id="editName" value="${site.name || ''}">
    </div>

    <div class="field">
      <label>English Description</label>
      <textarea id="editDescEng">${desc.descEng || ''}</textarea>
    </div>

    <div class="field">
      <label>Welsh Description</label>
      <textarea id="editDescWel">${desc.descWel || ''}</textarea>
    </div>

    <div class="field">
      <label>Hole Count</label>
      <input type="number" id="editHoles" value="${desc.holeCount ?? -1}">
    </div>

    <div class="field">
      <label>Latitude</label>
      <input id="editLat" value="${site.latitude}">
    </div>

    <div class="field">
      <label>Longitude</label>
      <input id="editLng" value="${site.longitude}">
    </div>

    <div class="field">
      <label>Status</label>
      <select id="editStatus">
        <option value="approved" ${site.status === 'approved' ? 'selected' : ''}>Approved</option>
        <option value="pending" ${site.status === 'pending' ? 'selected' : ''}>Pending</option>
        <option value="rejected" ${site.status === 'rejected' ? 'selected' : ''}>Rejected</option>
      </select>
    </div>

    <div class="field">
      <label>Photos</label>

      <div class="photo-grid">
        ${currentPhotos.map(photo => `
          <div class="photo-card">
            <img src="${photo.image_url}">
            <button class="delete-photo"
              onclick="deletePhoto(${photo.photo_id})">×</button>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="actions">
      <button class="save-btn" onclick="saveSite()">Save Changes</button>
      <button class="approve-btn" onclick="quickStatus('approved')">Approve</button>
      <button class="reject-btn" onclick="quickStatus('rejected')">Reject</button>
      <button class="delete-btn" onclick="deleteSite()">Delete Site</button>
    </div>
  `;
}

async function saveSite() {
  if (!currentSite) return;

  const updatedDescription = {
    descEng: document.getElementById('editDescEng').value,
    descWel: document.getElementById('editDescWel').value,
    holeCount: parseInt(document.getElementById('editHoles').value) || -1
  };

  const { error } = await sb
    .from('sites')
    .update({
      name: document.getElementById('editName').value,
      latitude: parseFloat(document.getElementById('editLat').value),
      longitude: parseFloat(document.getElementById('editLng').value),
      status: document.getElementById('editStatus').value,
      description: JSON.stringify(updatedDescription)
    })
    .eq('site_id', currentSite.site_id);

  if (error) {
    console.error(error);
    alert('Error saving site');
    return;
  }

  loadSites();
}

async function quickStatus(status) {
  if (!currentSite) return;

  await sb
    .from('sites')
    .update({ status })
    .eq('site_id', currentSite.site_id);

  currentSite.status = status;

  loadSites();
  openSite(currentSite);
}

async function deletePhoto(photoId) {
  const confirmed = confirm('Delete this photo?');
  if (!confirmed) return;

  await sb
    .from('photos')
    .delete()
    .eq('photo_id', photoId);

  openSite(currentSite);
}

async function deleteSite() {
  if (!currentSite) return;

  const confirmed = confirm('Are you sure?');
  if (!confirmed) return;

  await sb.from('photos').delete().eq('site_id', currentSite.site_id);
  await sb.from('sites').delete().eq('site_id', currentSite.site_id);

  currentSite = null;

  document.getElementById('editorCard').innerHTML = `
    <div class="empty">Site deleted</div>
  `;

  loadSites();
}checkAccess();
window.openSite = openSite;
window.saveSite = saveSite;
window.quickStatus = quickStatus;
window.deleteSite = deleteSite;
window.deletePhoto = deletePhoto;
</script>

</body>
</html>
