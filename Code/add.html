<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Site</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="db.js" defer></script>
</head>

<body>

<h1>Add Rock Cannon</h1>

<form id="form">
  <input id="name" placeholder="Site name" required />

  <input id="lat" placeholder="Latitude" required />
  <input id="lng" placeholder="Longitude" required />

  <textarea id="descEng" placeholder="Description (English)"></textarea>
  <textarea id="descWel" placeholder="Description (Welsh)"></textarea>

  <input id="holeCount" type="number" placeholder="Hole count (optional)" />
  <input type="file" id="imageUpload" multiple accept="image/*">

  <button type="submit">Add Site</button>
</form>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  async function waitForSession(retries = 5) {
    for (let i = 0; i < retries; i++) {
      const { data: { session } } = await sb.auth.getSession();
      if (session) return session;
      await new Promise(r => setTimeout(r, 200));
    }
    return null;
  }

  const session = await waitForSession();

  if (!session) {
    alert("Please log in");
    window.location.href = "login.html";
    return;
  }

  const role = await getUserRole();

  if (!role) {
    alert("Error loading user role");
    return;
  }

  if (role !== "contributor" && role !== "admin") {
    alert("You are not allowed to add sites");
    window.location.href = "map.html";
    return;
  }

  async function translateText(text, source, target) {
    try {
      const res = await fetch("https://libretranslate.de/translate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          q: text,
          source: source,
          target: target,
          format: "text"
        })
      });

      const data = await res.json();
      return data.translatedText || "";
    } catch (err) {
      console.error("Translation failed:", err);
      return "";
    }
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();

    let descEng = document.getElementById('descEng').value.trim();
    let descWel = document.getElementById('descWel').value.trim();

    let holeCount = document.getElementById('holeCount').value;
    holeCount = holeCount === "" ? -1 : parseInt(holeCount);

    if (descEng && !descWel) {
      descWel = await translateText(descEng, "en", "cy");
    } else if (!descEng && descWel) {
      descEng = await translateText(descWel, "cy", "en");
    }

    const { data: siteData, error: siteError } = await sb
      .from("sites")
      .insert([{
        name: document.getElementById('name').value,
        latitude: parseFloat(document.getElementById('lat').value),
        longitude: parseFloat(document.getElementById('lng').value),
        description: JSON.stringify({
          descEng,
          descWel,
          holeCount
        }),
        status: "pending"
      }])
      .select()
      .single();

    if (siteError) {
      console.error(siteError);
      alert("Site error: " + siteError.message);
      return;
    }

    const siteId = siteData.site_id;

    const files = document.getElementById("imageUpload").files;

    const uploadPromises = Array.from(files).map(async (file) => {
      const fileName = `${siteId}-${Date.now()}-${file.name}`;

      const { error: uploadError } = await sb.storage
        .from("site-images")
        .upload(fileName, file);

      if (uploadError) {
        console.error(uploadError);
        return;
      }

      const { data } = sb.storage
        .from("site-images")
        .getPublicUrl(fileName);

      return sb.from("photos").insert([{
        site_id: siteId,
        image_url: data.publicUrl,
        caption: null
      }]);
    });

    await Promise.all(uploadPromises);

    alert("Submitted for approval!");
    window.location.href = "map.html";
  });

});

console.log("PAGE LOADED");
</script>

</body>
</html>
