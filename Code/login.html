<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Login</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background: #272c2e;
        

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
    }

    .auth-container {
      width: 100%;
      max-width: 420px;

      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.08);

      backdrop-filter: blur(18px);

      border-radius: 28px;

      padding: 28px 22px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
    }

    .logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 18px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #26bd66,
          #117d3e
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;

      box-shadow:
        0 10px 30px rgba(38,189,102,0.35);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      opacity: 0.75;
      margin-top: 8px;
      margin-bottom: 28px;
      line-height: 1.5;
      font-size: 15px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      opacity: 0.85;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      border: none;

      background: rgba(255,255,255,0.07);

      color: white;

      border-radius: 16px;

      padding: 16px 18px;

      font-size: 16px;

      outline: none;

      transition:
        border 0.2s ease,
        background 0.2s ease,
        transform 0.15s ease;

      border: 1px solid transparent;
    }

    input:focus {
      border-color: #26bd66,;
      background: rgba(255,255,255,0.1);
    }

    input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 14px;

      transform: translateY(-50%);

      border: none;
      background: none;

      color: rgba(255,255,255,0.7);

      font-size: 14px;

      cursor: pointer;
    }

    .main-btn {
      width: 100%;
      border: none;

      padding: 16px;

      border-radius: 18px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.2s ease;

      margin-top: 8px;
    }

    .main-btn:active {
      transform: scale(0.98);
    }

    .login-btn {
      background:
        linear-gradient(
          135deg,
          #26bd66,
          #117d3e
        );

      color: white;
    }

    .signup-btn {
      margin-top: 12px;

      background: rgba(255,255,255,0.08);

      color: white;

      border: 1px solid rgba(255,255,255,0.08);
    }

    .secondary-actions {
      margin-top: 22px;

      display: flex;
      justify-content: center;
    }

    .back-link {
      color: #93c5fd;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }

    .back-link:hover {
      opacity: 1;
    }

    .status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
      opacity: 0.85;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 24px 18px;
        border-radius: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div class="auth-container">

  <div class="logo">
    🪨
  </div>

  <h1>Welcome back</h1>

  <div class="subtitle">
    Sign in to add sites, track visits and help grow the Rock Cannons map.
  </div>

  <div class="field">
    <label>Email</label>

    <div class="input-wrap">
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
      />
    </div>
  </div>

  <div class="field">
    <label>Password</label>

    <div class="input-wrap">
      <input
        id="password"
        type="password"
        placeholder="Your password"
        autocomplete="current-password"
      />

      <button
        class="password-toggle"
        type="button"
        onclick="togglePassword()"
      >
        Show
      </button>
    </div>
  </div>

  <button
    id="loginBtn"
    class="main-btn login-btn"
    onclick="login()"
  >
    Login
  </button>

  <button
    id="signupBtn"
    class="main-btn signup-btn"
    onclick="signup()"
  >
    Create account
  </button>

  <div class="status" id="status"></div>

  <div class="secondary-actions">
    <a class="back-link" href="map.html">
      ← Back to map
    </a>
  </div>

</div>

<script>
const statusEl = document.getElementById("status");

function setStatus(message) {
  statusEl.innerText = message || "";
}

function setLoading(loading) {
  document.body.classList.toggle("loading", loading);

  document.getElementById("loginBtn").disabled = loading;
  document.getElementById("signupBtn").disabled = loading;
}

function togglePassword() {
  const input = document.getElementById("password");

  input.type =
    input.type === "password"
      ? "text"
      : "password";
}

async function signup() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    setStatus("Please fill in all fields.");
    return;
  }

  setLoading(true);
  setStatus("Creating account...");

  const { data, error } =
    await sb.auth.signUp({
      email,
      password
    });

  if (error) {
    setLoading(false);
    setStatus(error.message);
    return;
  }

  await sb.from("users").insert([{
    user_id: data.user.id,
    email: data.user.email,
    role: "contributor"
  }]);

  setLoading(false);

  setStatus("Account created successfully 🎉");
}

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    setStatus("Please enter your email and password.");
    return;
  }

  setLoading(true);
  setStatus("Signing in...");

  const { error } =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    setLoading(false);
    setStatus(error.message);
    return;
  }

  setStatus("Success!");

  setTimeout(() => {
    window.location.href = "map.html";
  }, 400);
}

// enter key support
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    login();
  }
});
</script>

</body>
</html>
